name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust 1.91.0
        run: rustup toolchain install 1.91.0 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Install Rizin 0.9.1
        run: |
          curl -fsSL https://github.com/rizinorg/rizin/releases/download/v0.9.1/rizin-v0.9.1-static-x86_64.tar.xz -o "$RUNNER_TEMP/rizin.tar.xz"
          echo "9102249a9f0b6319c5334a2e5cf8d9cc3f2035e1d3def027c41f6a90f647e8cf  $RUNNER_TEMP/rizin.tar.xz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/rizin"
          tar -xJf "$RUNNER_TEMP/rizin.tar.xz" -C "$RUNNER_TEMP/rizin"
          echo "$RUNNER_TEMP/rizin/bin" >> "$GITHUB_PATH"
      - name: Format
        run: |
          cargo +1.91.0 fmt --all -- --check
          cargo +1.91.0 fmt --manifest-path ci/downstream/Cargo.toml -- --check
      - name: Test
        run: cargo +1.91.0 test --locked --workspace --all-targets
      - name: Run standalone downstream consumer
        run: CARGO_TARGET_DIR=target cargo +1.91.0 run --manifest-path ci/downstream/Cargo.toml
      - name: Documentation tests
        run: cargo +1.91.0 test --locked -p wire-repr --doc
      - name: Test CI tools
        run: python3 -m unittest discover -s ci/tests -v
      - name: Compile-failure diagnostics
        run: python3 ci/check-fail-fast.py --root "$GITHUB_WORKSPACE"
      - name: Clippy
        run: cargo +1.91.0 clippy --locked --workspace --all-targets -- -D warnings
      - name: Documentation
        run: RUSTDOCFLAGS='-D warnings' cargo +1.91.0 doc --locked --workspace --no-deps

  semver:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # Compares the runtime API with the latest published release; derive output is owned by tests.
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239
        with:
          package: wire-repr

  artifact-platforms:
    name: artifact (${{ matrix.name }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
          - name: windows-x86_64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust 1.91.0
        run: rustup toolchain install 1.91.0 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Install Rizin 0.9.1 on macOS
        if: runner.os == 'macOS'
        run: |
          curl -fsSL https://github.com/rizinorg/rizin/releases/download/v0.9.1/rizin-macos-v0.9.1.pkg -o "$RUNNER_TEMP/rizin.pkg"
          echo "949f56d56698bdad2f39996badc10d0ada13033fad5fc7ef4fe5eaa89d945e94  $RUNNER_TEMP/rizin.pkg" | shasum -a 256 --check
          sudo installer -pkg "$RUNNER_TEMP/rizin.pkg" -target /
      - name: Install Rizin 0.9.1 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "rizin.zip"
          Invoke-WebRequest "https://github.com/rizinorg/rizin/releases/download/v0.9.1/rizin-windows-static-v0.9.1.zip" -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne "2d14e0a6ecba1196dcd742d63de83bbaffed2a7a78ef5a0a9b4e92a0f73d1d28") {
            throw "Rizin archive checksum mismatch: $actual"
          }
          $destination = Join-Path $env:RUNNER_TEMP "rizin"
          Expand-Archive $archive -DestinationPath $destination
          Join-Path $destination "rizin-win-installer-vs2019_static-64/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Verify artifact analysis and native debug information
        run: cargo +1.91.0 test --locked -p wire-repr-measure --test harness

  measure:
    name: measure (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust 1.91.0
        run: rustup toolchain install 1.91.0 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Install Rizin 0.9.1
        run: |
          curl -fsSL https://github.com/rizinorg/rizin/releases/download/v0.9.1/rizin-v0.9.1-static-x86_64.tar.xz -o "$RUNNER_TEMP/rizin.tar.xz"
          echo "9102249a9f0b6319c5334a2e5cf8d9cc3f2035e1d3def027c41f6a90f647e8cf  $RUNNER_TEMP/rizin.tar.xz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/rizin"
          tar -xJf "$RUNNER_TEMP/rizin.tar.xz" -C "$RUNNER_TEMP/rizin"
          echo "$RUNNER_TEMP/rizin/bin" >> "$GITHUB_PATH"
      - name: Build measurement tool once
        run: cargo +1.91.0 build --locked -p wire-repr-measure --release
      # Every inventory entry lands in exactly one shard, so the three jobs cover the corpus.
      - name: Measure this shard of the generated corpus
        run: |
          set -euo pipefail
          target/release/wire-repr-measure list --json \
            | jq -r --argjson shard ${{ matrix.shard }} 'to_entries[] | select(.key % 3 == $shard) | .value' \
            > "$RUNNER_TEMP/workloads"
          test -s "$RUNNER_TEMP/workloads"
          while read -r workload; do
            target/release/wire-repr-measure run --workload "$workload" --json
          done < "$RUNNER_TEMP/workloads"
