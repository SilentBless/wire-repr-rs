name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust 1.91.0
        run: rustup toolchain install 1.91.0 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +1.91.0 fmt --all -- --check
      - name: Check
        run: cargo +1.91.0 check --workspace --no-default-features --all-targets
      - name: Check owned mode
        run: cargo +1.91.0 check --workspace --features bytes --all-targets
      - name: Test
        run: cargo +1.91.0 test --workspace --no-default-features --all-targets
      - name: Test owned mode
        run: cargo +1.91.0 test --workspace --features bytes --all-targets
      - name: Documentation tests
        run: cargo +1.91.0 test -p wire-repr --no-default-features --doc
      - name: Owned-mode documentation tests
        run: cargo +1.91.0 test -p wire-repr --features bytes --doc
      - name: Test CI tools
        run: python3 -m unittest discover -s ci/tests -v
      - name: Compile-failure diagnostics
        run: python3 ci/check-fail-fast.py --root "$GITHUB_WORKSPACE"
      - name: Clippy
        run: cargo +1.91.0 clippy --workspace --no-default-features --all-targets -- -D warnings
      - name: Clippy owned mode
        run: cargo +1.91.0 clippy --workspace --features bytes --all-targets -- -D warnings
      - name: Documentation
        run: RUSTDOCFLAGS='-D warnings' cargo +1.91.0 doc --workspace --no-default-features --no-deps
      - name: Owned-mode documentation
        run: RUSTDOCFLAGS='-D warnings' cargo +1.91.0 doc --workspace --features bytes --no-deps

  release-codegen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust 1.91.0 and Linux target
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          rustup target add x86_64-unknown-linux-gnu --toolchain 1.91.0
      - name: Check release code generation
        run: python3 ci/check-codegen.py --root "$GITHUB_WORKSPACE" --tolerance 10%
      - name: Check owned-mode release code generation
        run: python3 ci/check-codegen.py --root "$GITHUB_WORKSPACE" --mode bytes --tolerance 10%
