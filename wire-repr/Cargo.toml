[package]
name = "wire-repr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Derive zero-copy views and typestate writers for variable-length binary formats; no_std, no allocation."
documentation = "https://docs.rs/wire-repr"
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
autotests = false
autoexamples = false
keywords = ["binary", "parser", "protocol", "zero-copy", "no-std"]
exclude = ["measure/**"]
categories = ["encoding", "parser-implementations", "network-programming", "no-std", "no-std::no-alloc"]

[dependencies]
leb128fmt.workspace = true
thiserror.workspace = true
vu128.workspace = true
wire-repr-macros.workspace = true

[dev-dependencies]
bytes.workspace = true
getrandom.workspace = true

[[test]]
name = "suite"
path = "tests/suite.rs"

[[test]]
name = "protocol"
path = "tests/protocol.rs"

[[example]]
name = "dns"
path = "examples/dns.rs"

[[example]]
name = "ntp"
path = "examples/ntp.rs"

[[example]]
name = "telegram"
path = "examples/telegram.rs"

[[example]]
name = "expression_vm"
path = "examples/expression_vm.rs"

[lints]
workspace = true
