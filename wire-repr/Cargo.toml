[package]
name = "wire-repr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Exact-source wire views and progressive no-alloc writers for Rust."
documentation = "https://docs.rs/wire-repr"
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
autotests = false
autoexamples = false
keywords = ["binary", "zero-copy", "no-std", "no-alloc", "codegen"]
exclude = ["measure/**"]
categories = ["encoding", "no-std", "no-std::no-alloc"]

[dependencies]
thiserror.workspace = true
wire-repr-macros.workspace = true

[dev-dependencies]
bytes.workspace = true
getrandom.workspace = true

[[test]]
name = "suite"
path = "tests/suite.rs"

[[test]]
name = "protocol"
path = "tests/protocol.rs"

[[example]]
name = "dns"
path = "examples/dns.rs"

[[example]]
name = "ntp"
path = "examples/ntp.rs"

[[example]]
name = "telegram"
path = "examples/telegram.rs"

[[example]]
name = "expression_vm"
path = "examples/expression_vm.rs"

[lints]
workspace = true
