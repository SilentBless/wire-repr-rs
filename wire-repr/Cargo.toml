[package]
name = "wire-repr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Exact-source wire views and progressive no-alloc writers for Rust."
documentation = "https://docs.rs/wire-repr"
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
autotests = false
autoexamples = false
keywords = ["binary", "zero-copy", "no-std", "no-alloc", "codegen"]
exclude = ["measure/**"]
categories = ["encoding", "no-std", "no-std::no-alloc"]

[dependencies]
thiserror.workspace = true
wire-repr-macros.workspace = true

[dev-dependencies]
bytes.workspace = true

[[test]]
name = "suite"
path = "tests/suite.rs"

[[test]]
name = "protocol"
path = "tests/protocol.rs"

[[example]]
name = "packet"
path = "examples/packet.rs"

[[example]]
name = "mtproto"
path = "examples/mtproto.rs"

[[example]]
name = "ipv4"
path = "examples/ipv4.rs"

[[example]]
name = "recursive"
path = "examples/recursive.rs"

[lints]
workspace = true
