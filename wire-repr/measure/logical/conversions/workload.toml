name = "logical/conversions"

[roles]
generated = "generated.rs"
idiomatic = "idiomatic.rs"
best_latency = "best/latency.rs"

[[cases]]
name = "decode"
entry = "decode"
seeds = [0, 1, 4294967296, 72057594037927936, -1]
[cases.runtime]
samples = 7
target_ms = 2
warmup = 100
[[cases.formulas]]
name = "ergonomic_tax"
expression = "percent(generated_runtime_median_ns, idiomatic_runtime_median_ns)"
unit = "%"
[[cases.formulas]]
name = "optimization_gap"
expression = "percent(generated_runtime_median_ns, best_latency_runtime_median_ns)"
unit = "%"
[[cases.rules]]
name = "artifact invariants"
level = "error"
assert = "generated_artifact_transitive_indirect_calls == 0 && generated_artifact_transitive_allocation_symbols == 0"
[[cases.rules]]
name = "idiomatic code shape"
level = "error"
assert = "generated_artifact_instructions <= idiomatic_artifact_instructions * 1.05 + 1 && generated_artifact_stack_bytes <= idiomatic_artifact_stack_bytes + 8"
[[cases.rules]]
name = "best safe attention"
level = "attention"
assert = "generated_runtime_median_ns <= best_latency_runtime_median_ns * 1.05"
message = "generated checked conversion has safe optimization headroom"

