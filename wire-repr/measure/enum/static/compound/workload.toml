name = "enum/static/compound"

[roles]
generated = "generated.rs"
idiomatic = "idiomatic.rs"
best_latency = "best/latency.rs"

[[cases]]
name = "decode"
entry = "decode"
seeds = [0, 1, 2, 81985529216486895]
[cases.runtime]
samples = 7
target_ms = 2
warmup = 100
[[cases.formulas]]
name = "ergonomic_tax"
expression = "percent(generated_runtime_median_ns, idiomatic_runtime_median_ns)"
unit = "%"
[[cases.rules]]
name = "direct dispatch"
level = "error"
assert = "generated_artifact_indirect_calls == 0"
[[cases.rules]]
name = "idiomatic latency attention"
level = "attention"
assert = "generated_runtime_median_ns <= idiomatic_runtime_median_ns * 1.35"
message = "generated enum decode has measurable static-dispatch overhead"

