[workspace]
members = ["ci/measure", "wire-repr", "wire-repr-macros"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/SilentBless/wire-repr-rs"
homepage = "https://github.com/SilentBless/wire-repr-rs"

[workspace.dependencies]
bytes = { version = "1", default-features = false }
getrandom = { version = "0.4", default-features = false, features = ["std"] }
proc-macro-crate = { version = "3.5", default-features = false }
proc-macro2 = { version = "1", default-features = false, features = ["proc-macro"] }
quote = { version = "1", default-features = false }
syn = { version = "2", default-features = false, features = ["clone-impls", "full", "parsing", "printing", "proc-macro", "derive", "visit"] }
thiserror = { version = "2", default-features = false }
wire-repr-macros = { path = "wire-repr-macros", version = "1.0.0" }

[workspace.lints.rust]
unsafe_code = "deny"
