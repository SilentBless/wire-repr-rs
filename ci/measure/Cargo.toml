[package]
name = "wire-repr-measure"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
capstone = { version = "0.14", default-features = false, features = ["arch_arm64", "arch_x86", "full", "std"] }
clap = { version = "4.5", features = ["derive"] }
evalexpr = "13.1"
object = { version = "0.40", features = ["read"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
toml = "1.1"

[lints]
workspace = true
